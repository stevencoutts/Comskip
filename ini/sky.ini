; Sky / UK PAL profile. Official Comskip defaults with the knobs this
; recording actually needs. Do not enable ident cutscenes: Sky plays
; those mid-show as well as at ad breaks.
;
; Usage: ./comskip --ini ini/sky.ini "recording.ts"

detect_method=111
validate_silence=1
validate_uniform=1
validate_scenechange=1
verbose=5
fps=25
intelligent_brightness=0

max_brightness=60
test_brightness=40
max_avg_brightness=25
non_uniformity=500
max_volume=500
min_silence=12
volume_slip=20

max_commercialbreak=600
min_commercialbreak=20
max_commercial_size=125
min_commercial_size=4
min_show_segment_length=125

logo_threshold=0.75
logo_filter=4
logo_at_bottom=1
logo_percentile=0.92
punish_no_logo=0
aggressive_logo_rejection=0
connect_blocks_with_logo=1
shrink_logo=5
after_logo=6
give_up_logo_search=2000

padding=0
remove_before=0
remove_after=0
added_recording=14
delete_block_after_commercial=7
delete_show_after_last_commercial=1
delete_show_before_or_after_current=0
min_commercial_break_at_start_or_end=39

cut_on_ar_change=1
disable_heuristics=0
punish=0
ms_audio_delay=5
max_repair_size=200

output_default=1
output_edl=1
output_framearray=0
delete_logo_file=1
output_debugwindow=0
live_tv=0
